[project]
name = "ro-generator"
version = "1.2.0"
description = "RO 单据装配核心包：业务规则唯一源"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "Pillow>=10.0",
]

[project.scripts]
ro-generate = "ro_generator.cli:cli_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ro_generator"]

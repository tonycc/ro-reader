[project]
name = "ro-workbench-api"
version = "0.0.0"
description = "工作台后端：核心包的 FastAPI 网络包装层"
requires-python = ">=3.11"
dependencies = [
    "ro-generator",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[tool.uv.sources]
ro-generator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ro_workbench_api"]

name: build-launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/ro_workbench_launcher/**'
      - 'packages/ro_workbench_api/**'
      - 'packages/ro_generator/**'
      - 'frontend/**'
      - '.github/workflows/build-launcher.yml'

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv python install 3.11
      - run: uv sync --all-packages

      # Build frontend (needed for both platforms)
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npx vite build
        working-directory: frontend

      # PyInstaller build (onedir mode)
      - run: uv run pyinstaller packages/ro_workbench_launcher/ro-workbench.spec --distpath dist --workpath build --noconfirm

      # macOS: package as .dmg
      - name: Package DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          APP="dist/RO Workbench.app"
          DMG="dist/RO-Workbench-0.1.0-mac.dmg"
          hdiutil create -volname "RO Workbench" \
            -srcfolder "$APP" \
            -ov -format UDZO "$DMG"

      # Windows: zip the output folder, no installer needed
      - name: Package ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\RO Workbench" -DestinationPath "dist\RO-Workbench-0.1.0-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ro-workbench-${{ matrix.os }}
          path: dist/

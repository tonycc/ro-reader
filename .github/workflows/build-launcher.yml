name: build-launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/ro_workbench_launcher/**'
      - 'packages/ro_workbench_api/**'
      - 'packages/ro_generator/**'
      - 'frontend/**'
      - '.github/workflows/build-launcher.yml'

env:
  APP_VERSION: "0.1.0"
  # Opt into Node.js 24 now — GitHub will force it on 2026-06-16
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false          # let both platforms finish even if one fails
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv python install 3.11
      - run: uv sync --all-packages

      # Build frontend (needed for both platforms)
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npx vite build
        working-directory: frontend

      # PyInstaller build (onedir mode)
      - run: uv run pyinstaller packages/ro_workbench_launcher/ro-workbench.spec --distpath dist --workpath build --noconfirm

      # macOS: package as .dmg
      - name: Package DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          APP="dist/赛肯单据生成工具.app"
          DMG="dist/赛肯单据工具-${{ env.APP_VERSION }}-mac.dmg"
          hdiutil create -volname "赛肯单据生成工具" \
            -srcfolder "$APP" \
            -ov -format UDZO "$DMG"
          # 删除源 .app，只保留 .dmg，避免 artifact 中重复
          rm -rf "$APP"

      # Windows: 生成辅助文件 + 打 ZIP
      - name: Package ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $v = "${{ env.APP_VERSION }}"
          $d = Get-Date -Format "yyyy-MM-dd"

          # VERSION.txt
          $lines = @(
            "赛肯单据生成工具 v$v",
            "构建日期：$d",
            "来源：GitHub Actions"
          )
          [System.IO.File]::WriteAllLines("$PWD\dist\VERSION.txt", $lines, [System.Text.Encoding]::UTF8)

          # launch.bat：显示启动进度，浏览器打开后自动关闭窗口
          # PS 监控脚本以 Base64(-EncodedCommand) 内嵌，避免 bat/PS 转义冲突
          $psLines = @(
            "`$portFile = `$env:TEMP + '\saiken_doc_port.txt'",
            "`$deadline = (Get-Date).AddSeconds(30)",
            "Write-Host '  [1/3] 正在初始化 ' -NoNewline -ForegroundColor Cyan",
            "while (!(Test-Path `$portFile)) {",
            "    if ((Get-Date) -ge `$deadline) { Write-Host ' 超时' -ForegroundColor Red; Start-Sleep 2; exit 1 }",
            "    Write-Host '.' -NoNewline; Start-Sleep 0.3",
            "}",
            "`$port = (Get-Content `$portFile).Trim()",
            "Write-Host ''",
            "Write-Host ('  [2/3] 服务端口：' + `$port) -ForegroundColor Cyan",
            "`$url = 'http://127.0.0.1:' + `$port + '/api/health'",
            "`$deadline = (Get-Date).AddSeconds(30)",
            "Write-Host '  [3/3] 等待服务就绪 ' -NoNewline -ForegroundColor Cyan",
            "while (`$true) {",
            "    try { if ((Invoke-WebRequest `$url -UseBasicParsing -TimeoutSec 1 -ErrorAction Stop).StatusCode -eq 200) { break } } catch {}",
            "    if ((Get-Date) -ge `$deadline) { Write-Host ' 超时' -ForegroundColor Red; Start-Sleep 2; exit 1 }",
            "    Write-Host '.' -NoNewline; Start-Sleep 0.3",
            "}",
            "Write-Host ''",
            "Write-Host '  启动成功！浏览器已打开。' -ForegroundColor Green",
            "Start-Sleep 0.8"
          )
          $psScript = $psLines -join "`n"
          $encoded = [Convert]::ToBase64String([System.Text.Encoding]::Unicode.GetBytes($psScript))
          $bat  = "@echo off`r`n"
          $bat += "chcp 65001 > nul`r`n"
          $bat += "title 赛肯单据生成工具`r`n"
          $bat += "echo.`r`n"
          $bat += "echo   赛肯单据生成工具`r`n"
          $bat += "echo   ==================`r`n"
          $bat += "echo.`r`n"
          $bat += "echo   正在启动，请稍候...`r`n"
          $bat += "echo.`r`n"
          $bat += "if exist `"%TEMP%\saiken_doc_port.txt`" del `"%TEMP%\saiken_doc_port.txt`"`r`n"
          $bat += "start `"`" /B `"%~dp0赛肯单据生成工具\赛肯单据生成工具.exe`"`r`n"
          $bat += "powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand $encoded`r`n"
          [System.IO.File]::WriteAllText("$PWD\dist\launch.bat", $bat, [System.Text.Encoding]::UTF8)

          # README.txt（中文）
          $readme = @(
            "赛肯单据生成工具 v$v",
            "",
            "【首次使用】",
            "1. 将 ZIP 解压到固定位置",
            "   例如：C:\Users\<用户名>\赛肯单据工具\",
            "2. 双击 launch.bat 启动",
            "3. 浏览器会自动打开",
            "4. 点击右上角设置，配置 BASE 文件路径",
            "",
            "【更新升级】",
            "1. 右键托盘图标 → 退出",
            "2. 删除旧的「赛肯单据生成工具」文件夹",
            "3. 将新 ZIP 中的「赛肯单据生成工具」文件夹解压到同一位置",
            "4. 再次双击 launch.bat 启动",
            "   （文件路径已保存在浏览器中，自动恢复）",
            "",
            "【常见问题】",
            "Q：Windows 提示「已阻止此应用」",
            "A：点击「更多信息」→「仍要运行」",
            "",
            "Q：浏览器没有自动打开",
            "A：请访问托盘图标提示中显示的地址 http://127.0.0.1:<端口号>",
            "",
            "Q：如何退出",
            "A：右键任务栏右下角托盘图标 → 退出"
          )
          [System.IO.File]::WriteAllLines("$PWD\dist\README.txt", $readme, [System.Text.Encoding]::UTF8)

          # 清理 PyInstaller 在 dist\ 根目录留下的中间产物 exe
          Remove-Item -Path "dist\*.exe" -ErrorAction SilentlyContinue

          # 打包（只含程序文件夹和辅助文件，不含中间产物）
          Compress-Archive `
            -Path "dist\赛肯单据生成工具", "dist\launch.bat", "dist\VERSION.txt", "dist\README.txt" `
            -DestinationPath "dist\赛肯单据工具-$v-windows.zip"

          # 删除源文件，只保留 .zip，避免 artifact 中重复
          Remove-Item -Recurse -Force "dist\赛肯单据生成工具" -ErrorAction SilentlyContinue
          Remove-Item -Force "dist\launch.bat", "dist\VERSION.txt", "dist\README.txt" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: ro-workbench-${{ matrix.os }}
          path: dist/
          retention-days: 3

name: build-launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/ro_workbench_launcher/**'
      - 'packages/ro_workbench_api/**'
      - 'packages/ro_generator/**'
      - 'frontend/**'
      - '.github/workflows/build-launcher.yml'

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv python install 3.11
      - run: uv sync --all-packages

      # Build frontend (needed for both platforms)
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npx vite build
        working-directory: frontend

      # PyInstaller build (onedir mode)
      - run: uv run pyinstaller packages/ro_workbench_launcher/ro-workbench.spec --distpath dist --workpath build --noconfirm

      # macOS: package as .dmg
      - name: Package DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          APP="dist/RO Workbench.app"
          DMG="dist/RO-Workbench-0.1.0-mac.dmg"
          hdiutil create -volname "RO Workbench" \
            -srcfolder "$APP" \
            -ov -format UDZO "$DMG"

      # Windows: 生成辅助文件 + 打 ZIP
      - name: Package ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $v = "0.1.0"
          $d = Get-Date -Format "yyyy-MM-dd"

          # VERSION.txt
          $lines = @(
            "RO Workbench v$v",
            "Build date: $d",
            "Source: GitHub Actions"
          )
          [System.IO.File]::WriteAllLines("$PWD\dist\VERSION.txt", $lines, [System.Text.Encoding]::UTF8)

          # launch.bat（bat 文件名用 ASCII，避免编码问题）
          $bat = "@echo off`r`nstart `"`" `"%~dp0RO Workbench\RO Workbench.exe`"`r`n"
          [System.IO.File]::WriteAllText("$PWD\dist\launch.bat", $bat, [System.Text.Encoding]::ASCII)

          # README.txt
          $readme = @(
            "RO Workbench v$v",
            "",
            "[First Run]",
            "1. Extract this ZIP to a fixed location",
            "   e.g. C:\Users\<username>\RO Workbench\",
            "2. Double-click launch.bat",
            "3. Browser opens automatically",
            "4. Click Settings (top-right) to set BASE file path",
            "",
            "[Updating]",
            "1. Right-click tray icon -> Exit",
            "2. Delete the old 'RO Workbench' folder",
            "3. Extract new ZIP's 'RO Workbench' folder to same location",
            "4. Double-click launch.bat again",
            "   (file path setting is saved in the browser, restored automatically)",
            "",
            "[FAQ]",
            "Q: Windows shows 'Windows protected your PC'",
            "A: Click 'More info' -> 'Run anyway'",
            "",
            "Q: Browser did not open automatically",
            "A: Visit http://127.0.0.1:<port> shown in tray icon tooltip",
            "",
            "Q: How to exit",
            "A: Right-click the tray icon (bottom-right) -> Exit"
          )
          [System.IO.File]::WriteAllLines("$PWD\dist\README.txt", $readme, [System.Text.Encoding]::UTF8)

          # 清理 PyInstaller 在 dist\ 根目录留下的中间产物 exe
          Remove-Item -Path "dist\*.exe" -ErrorAction SilentlyContinue

          # 打包（只含程序文件夹和辅助文件，不含中间产物）
          Compress-Archive `
            -Path "dist\RO Workbench", "dist\launch.bat", "dist\VERSION.txt", "dist\README.txt" `
            -DestinationPath "dist\RO-Workbench-$v-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ro-workbench-${{ matrix.os }}
          path: dist/

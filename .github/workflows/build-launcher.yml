name: build-launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/ro_workbench_launcher/**'
      - 'packages/ro_workbench_api/**'
      - 'packages/ro_generator/**'
      - 'frontend/**'
      - '.github/workflows/build-launcher.yml'

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv python install 3.11
      - run: uv sync --all-packages

      # Build frontend (needed for both platforms)
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npx vite build
        working-directory: frontend

      # PyInstaller build (onedir mode)
      - run: uv run pyinstaller packages/ro_workbench_launcher/ro-workbench.spec --distpath dist --workpath build --noconfirm

      # macOS: package as .dmg
      - name: Package DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          APP="dist/RO Workbench.app"
          DMG="dist/RO-Workbench-0.1.0-mac.dmg"
          hdiutil create -volname "RO Workbench" \
            -srcfolder "$APP" \
            -ov -format UDZO "$DMG"

      # Windows: 生成辅助文件 + 打 ZIP
      - name: Package ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "0.1.0"
          $date = Get-Date -Format "yyyy-MM-dd"

          # VERSION.txt
          @"
RO Workbench v$version
构建日期：$date
构建来源：GitHub Actions
"@ | Out-File -Encoding utf8 "dist\VERSION.txt"

          # 启动 RO 工作台.bat（放在 ZIP 根目录，双击即启动）
          @'
@echo off
start "" "%~dp0RO Workbench\RO Workbench.exe"
'@ | Out-File -Encoding ascii "dist\启动 RO 工作台.bat"

          # 使用说明.txt
          @"
【RO 单据工作台 v$version 使用说明】

首次使用
--------
1. 将整个文件夹解压到固定位置
   建议路径：C:\Users\<你的用户名>\RO Workbench\
2. 双击"启动 RO 工作台.bat"
3. 浏览器自动打开工作台界面
4. 点右上角"系统设置"，配置 BASE 文件路径

更新版本
--------
1. 右键托盘图标 → 退出
2. 删除旧的 "RO Workbench" 文件夹（保留 bat 和 txt 文件）
3. 将新版 ZIP 中的 "RO Workbench" 文件夹解压到同一位置
4. 重新双击"启动 RO 工作台.bat"
   （文件路径配置保存在浏览器中，更新后自动恢复）

常见问题
--------
Q：首次运行弹出"Windows 已保护你的电脑"
A：点"更多信息" → "仍要运行"

Q：浏览器没有自动打开
A：手动访问 http://127.0.0.1:xxxxx（端口号见托盘图标提示）

Q：如何退出程序
A：右键系统托盘右下角图标 → 退出

技术支持：请联系发给你此文件的同事
"@ | Out-File -Encoding utf8 "dist\使用说明.txt"

          # 打包（根目录放 bat、txt；RO Workbench 文件夹是程序本体）
          Compress-Archive `
            -Path "dist\RO Workbench", "dist\启动 RO 工作台.bat", "dist\VERSION.txt", "dist\使用说明.txt" `
            -DestinationPath "dist\RO-Workbench-$version-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ro-workbench-${{ matrix.os }}
          path: dist/

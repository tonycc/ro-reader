name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { version: latest }
      - run: uv python install 3.11
      - run: uv sync --all-packages
      # e2e 打开的是合成 base 文件（.gitignore，需生成）；后端 webServer 以仓库根为 cwd。
      - run: uv run python tests/fixtures/generate_synthetic_base.py
        working-directory: ${{ github.workspace }}
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install chromium --with-deps
      # PDF 导出经 LibreOffice 无头转换（保证版式=Excel 模板），e2e 的真实 PDF 下载用例需要它。
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: pnpm run test:e2e

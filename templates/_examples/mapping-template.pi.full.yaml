# Example only. This file demonstrates a full PI mapping structure.
# It is based on the mature PI pattern in the repository, but it is not a
# universal production template for every entity or document type.

document: pi
template_version: "2026.06"
template: templates/<entity>/pi.xlsx
sheet: <worksheet name>

header:
  pi_no: B6
  document_date: G6
  payment_terms: B7
  ex_factory_date: G7
  bill_to: B9
  bill_to_line2: B10
  bill_to_line3: B11
  ship_to: G9
  ship_to_line2: G10
  ship_to_line3: G11
  manufacturer_name: G13
  manufacturer_address: G14
  manufacturer_address_2: G15
  port_of_loading: B13
  final_destination: B14

header_fixed:
  bill_to: <bill-to line 1>
  bill_to_line2: <bill-to line 2>
  bill_to_line3: <bill-to line 3>
  payment_terms: Net 90 days
  port_of_loading: <port of loading>
  final_destination: <final destination>
  manufacturer_name: <manufacturer name>
  manufacturer_address: <manufacturer address line 1>
  manufacturer_address_2: <manufacturer address line 2>

# Optional but recommended when a real table header row exists above start_row.
table_header_row: 17

lines:
  start_row: 18
  # Must point to a real data-style row. Renderer will also use it to
  # normalize reserved detail-row styles before writing values.
  style_source_row: 18
  row_fixed:
    A: China
  columns:
    po_no: B
    item_line_no: C
    description: D
    unit_price: E
    quantity: F
    amount: G
    confirmed_ex_factory_date: H

totals:
  amount: G24
  signature:
    cell: G26
    value_mode: fixed
    value: <signer name>
  Date:
    cell: G27
    value_mode: current_date

style:
  bold:
    - A1
    - A2
    - A4
    - A6
    - A7
    - A9
    - A13
    - A14
    - A17
    - F6
    - F7
    - F9
    - F13
    - F14
    - F24
    - F26
    - F27
    - G24

preview_content:
  title: PROFORMA INVOICE
  terms_fields:
  static_terms:
  notes: []
  source_overrides:
    po_no:
      sheet: <source sheet name>
      field: <source field name>
      rule: <source rule description>
    pi_no:
      sheet: <source sheet name>
      field: <source field name>
      rule: <source rule description>
  column_labels:
    A: Country of The Origin
    po_no: PO Number
    item_line_no: Item No.
    description: Description
    unit_price: USD Unit Price
    quantity: Quantity
    amount: USD Amount
    confirmed_ex_factory_date: EX-FACTORY DATE
  seller_info:
    - <seller line 1>
    - <seller line 2>
  layout:
    top:
      left: [seller_info]
      center: [title]
      right: []
    info:
      left:
        [
          pi_no,
          payment_terms,
          bill_to,
          bill_to_line2,
          bill_to_line3,
          port_of_loading,
          final_destination,
        ]
      right:
        [
          document_date,
          ex_factory_date,
          ship_to,
          ship_to_line2,
          ship_to_line3,
          manufacturer_name,
          manufacturer_address,
          manufacturer_address_2,
        ]
